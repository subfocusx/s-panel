; s-panel example config — copy to config.ini next to loader.exe / taskbar.dll
[Panel]
; Windows 11 default: 48. Compact like Win10: 40. Minimal: 34.
TaskbarHeight=34
; Windows 11 default: 24 (blurry, downscaled from 32). Crisp: 32 or 16.
IconSize=16
; Windows 11 default: 44.
TaskbarButtonWidth=28
; Tray icon cell width, px. Windows 11 default: 32 (smaller = denser, bigger = roomier).
TrayIconSize=32
; Extra spacing between taskbar icons, px. 0 = Windows default.
TaskbarIconSpacing=0
; Extra spacing between tray icons, px. 0 = Windows default.
TrayIconSpacing=0
